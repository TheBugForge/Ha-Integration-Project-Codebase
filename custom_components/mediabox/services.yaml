send_key:
  name: Send Key
  description: Send a key press to the Mediabox.
  target:
    device:
      integration: mediabox
  fields:
    key:
      name: Key
      description: The key name to send (e.g. "Up", "Play", "Back").
      required: true
      example: "Up"
      selector:
        text: {}

send_action:
  name: Send Action
  description: Send an action to the Mediabox.
  target:
    device:
      integration: mediabox
  fields:
    action:
      name: Action
      description: The action name to send (e.g. "Play", "Pause").
      required: true
      example: "Play"
      selector:
        text: {}
